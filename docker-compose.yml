version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: moon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: moonroot123
      MYSQL_DATABASE: moon
      MYSQL_USER: moon
      MYSQL_PASSWORD: moon123
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: moon-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Adminer for MySQL GUI (accessible at localhost:8080)
  adminer:
    image: adminer
    container_name: moon-adminer
    ports:
      - '8080:8080'
    depends_on:
      - mysql

volumes:
  mysql_data:
  redis_data:

networks:
  default:
    name: moon-network
