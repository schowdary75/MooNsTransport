name: Lighthouse Audit

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build --workspace=@moon/web
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: dummy_key
          CLERK_SECRET_KEY: dummy_key
          DATABASE_URL: mysql://root:root@localhost/dummy
          NEXT_PUBLIC_OTP_API_URL: http://localhost:8080

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          lhci collect --staticDistDir=apps/web/.next
          lhci assert --assertions.performance=0.85 --assertions.accessibility=0.85
        continue-on-error: true # Let checks complete even if score is warning level
