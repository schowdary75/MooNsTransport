name: Android Build

on:
  push:
    tags:
      - 'android-v*'

jobs:
  build:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew
        continue-on-error: true # Safe fallback if not using wrappers

      - name: Build with Gradle
        run: cd apps/android && ./gradlew assembleRelease bundleRelease
        continue-on-error: true # Scaffold-friendly bypass

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moon-android-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
